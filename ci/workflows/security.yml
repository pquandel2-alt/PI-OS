# Security checks. Move to .github/workflows/ (needs a token with the `workflow` scope).
name: Security
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 1"          # weekly: new CVEs appear without code changes
permissions:
  contents: read
jobs:
  dependencies-and-static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pip-audit bandit
      - run: pip-audit -r requirements.txt
      - name: bandit (fail on high severity)
        run: bandit -q -r pios pios_updater pios_firewall pios_sysops pios_connd scripts -lll
      - name: No secrets or private keys in the tree
        run: |
          ! git grep -n -I -E 'BEGIN ((RSA|EC|DSA|OPENSSH|ENCRYPTED) )?PRIVATE KEY|ghp_[A-Za-z0-9]{30,}|gho_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}|AKIA[0-9A-Z]{16}' -- . ':!tests' ':!docs'
      - run: git ls-files | grep -E '(^|/)(private\.key|.*\.pem|\.env)$' && exit 1 || true
  system-level-tests:
    # firewall in network namespaces, hardened units under real systemd, real ClamAV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables iproute2 curl zstd clamav clamav-daemon clamav-freshclam
      - run: python -m venv ../venv && ../venv/bin/pip install -r requirements.txt -r requirements-dev.txt
      - name: Real ClamAV (signatures + clamd)
        run: |
          sudo systemctl stop clamav-freshclam clamav-daemon || true
          sudo freshclam
          sudo systemctl start clamav-daemon
          for i in $(seq 1 90); do [ -S /var/run/clamav/clamd.ctl ] && break; sleep 2; done
          sudo chmod 666 /var/run/clamav/clamd.ctl
      - run: PIOS_REAL_CLAMD=/var/run/clamav/clamd.ctl ../venv/bin/python -m pytest -q tests/security tests/shield tests/firewall tests/test_service_hardening.py
