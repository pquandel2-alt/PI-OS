# Appended to /etc/clamav/clamd.conf by the image build (see image/stage-pios/00-pios/01-run.sh).
# Tuned for a Raspberry Pi: on-demand daemon, small thread pool, no double memory during signature reload.
LocalSocket /run/clamav/clamd.ctl
LocalSocketGroup clamav
LocalSocketMode 660
MaxThreads 2
ConcurrentDatabaseReload no
MaxFileSize 1100M
MaxScanSize 2000M
StreamMaxLength 1100M
MaxRecursion 12
MaxFiles 5000
AlertExceedsMax yes
DetectPUA no
